# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# dataset root dir
path: data/fluorescent_cells
 # train images (relative to 'path')   
train: images/train 
# val images (relative to 'path')  
val: images/test 

# Classes
# number of classes
nc: 1
# class names
names: ['Cell'] 

# training command (640 x 640)        
# python train.py --img 640 --data data/cells.yaml  --weights yolov5x.pt --batch-size -1 --epochs 25 

