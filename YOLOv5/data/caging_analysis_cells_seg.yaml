# Cell dataset
# parent
# ├── datasets
#       └── path
#            └── images
#                  └── train 
#                  └── test

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# dataset root dir
path: caging_analysis_cells_seg
 # train images (relative to 'path')   
train: images/train 
# val images (relative to 'path')  
val: images/test 

# Classes
# number of classes
nc: 3
# class names 
# NOTE: The class names in the list should be the same as the class names used in the annotations!
names: ['Cell', 'Bead', 'cages'] 

# training command (640 x 640)        
# yolo segment train data=datasets/caging_analysis_cells_seg.yaml model=yolov8x-seg.pt epochs=10 imgsz=640 

