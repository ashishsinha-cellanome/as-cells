# configs/data/denvr.yaml
# @package _global_

defaults:
  # CRITICAL: This puts the default data config inside 'cfg.data'
  # If you just use "- default", it puts keys at the root and breaks everything.
  - /data@data: default

# 1. FIX THE CRASH: Hardcode run_name
# This stops Hydra from trying to interpolate the broken ${model.backbone.name}
run_name: "rtdetrv2_dinov2_${now:%Y-%m-%d_%H-%M-%S}"

# 2. FIX THE MISSING KEY
# We manually inject the key you "fucked" so downstream code works
model:
  backbone:
    name: "dinov2"
    type: "dinov2"

# 3. OVERRIDE: Data loads from Fast Scratch
data:
  path: "/home/ubuntu/scratch/cellanome/TRAINING_DATA"
  val_name: 'valid'
  test_name: 'test'
  train_name: 'train'

# 4. OVERRIDE: Checkpoints to NAS
checkpointing:
  save_dir: "/mnt/personal/cellanome/checkpoints/"
  
  # _folder_name: "dinov2_backbone_rtdetr"
  
  rtdetr_initial_checkpoint: "/mnt/personal/cellanome/checkpoints/${checkpointing._folder_name}"
  dinov2_backbone_checkpoint: "/mnt/personal/cellanome/checkpoints/backbones/dinov2"
  
  val_image_dir: "/mnt/personal/cellanome/checkpoints/${checkpointing._folder_name}/predictions"

# 5. OVERRIDE: Logs to Scratch
hydra:
  run:
    dir: "/home/ubuntu/scratch/cellanome/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "/home/ubuntu/scratch/cellanome/logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"