# @package _global_

defaults:
  - default@data

data:
  path: "/mnt/direct-attached/TRAINING_DATA"
  train_name: "train_new"
  val_name: "valid"
  test_name: "test"

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0

checkpointing:
  save_dir: "/mnt/direct-attached/checkpoints/"
  rtdetr_initial_checkpoint: "/mnt/direct-attached/checkpoints/${checkpointing._folder_name}"
  dinov2_backbone_checkpoint: "/mnt/direct-attached/checkpoints/backbones/dinov2"

hydra:
  run:
    dir: "/mnt/direct-attached/logs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "/mnt/direct-attached/logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}"