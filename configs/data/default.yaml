# configs/data/default.yaml
# Default (full) dataset configuration

defaults:
  - transforms
  - _self_

# data:
path: "/mnt/direct-attached/PHASE2" # Changed to phase2 data path since Phase 2 experiments rely on static dataset structures here
model_input_size: ${model.input_size}
min_random_scale: 0.7
max_random_scale: 1.0
p_noise: 0.25
org_images_in_model_input_size: true

# Dataloader params
batch_size: 16
num_workers: 4

# Data limiting
num_overfit_samples: 0.
limit_train_batches: 1.0 # 1.0 = all data
limit_val_batches: 1.0
limit_test_batches: 1.0

val_name: 'valid' # Default to valid_annotations.json generated offline to ensure uncropped masks are loaded correctly
test_name: 'test' # Default to test_annotations.json
train_name: 'train_new' # Default to train_new_annotations.json which contains safely processed offline RLE masks
