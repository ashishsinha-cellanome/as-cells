# configs/optimizer/adamw_scaled.yaml
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4 # 5.0e-5
  weight_decay: 1e-4 
  # max_grad_norm: 5.0

scheduler:
  type: "reduce_lr_on_plateau"
  warmup_steps: 1000
  factor: 0.9
  patience: 5
  T_max: ${trainer.max_epochs}
  last_epoch: -1
  eta_min: 1e-6

training:
  profiler:
    type: 'simple'