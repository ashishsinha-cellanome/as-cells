name: rf_detr_seg_${model.rfdetr.size}
input_size: 672

rfdetr:
  size: medium             # small|medium|large
  pretrain_weights: null # auto-select size-matched defaults unless explicitly overridden
  num_queries: null
  expand_query: false
  num_select: ${model.rfdetr.num_queries}
  finetune_mode: queries_decoder_head # full|queries_head|queries_decoder_head

  # RF-DETR data/training behavior
  multi_scale: true
  expanded_scales: true
  do_random_resize_via_padding: false
  square_resize_div_64: true
  use_ema: true
  ema_decay: 0.993
  ema_tau: 1000
  lr_scheduler: cosine
  warmup_epochs: 1.0
  lr_min_factor: 0.0

# --- General ---
label_map:
  0: "cell"
  1: "bead"
  2: "cell-adhered"
  3: "soma"

detection_threshold: 0.05
draw_threshold: 0.4
max_detections: 100 # for crowded scenes, set >= model.rfdetr.num_select (or override via CLI)

ema:
  enabled: true
  decay: 0.993
  tau: 1000
  warmup_steps: 2000
