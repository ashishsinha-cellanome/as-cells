name: yolov26
input_size: 640

yolov26:
  weights: yolo26m.pt
  dataset_cache_dir: ${hydra:runtime.cwd}/.cache/datasets/yolov26_${data.train_name}_${data.val_name}_${data.test_name}
  epochs: 100
  batch_size: 16
  project: ${checkpointing.save_dir}/yolov26
  name: yolov26_train
  
  # Hyperparameters for ultralytics
  hyp:
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005

# General
label_map:
  0: "cell"
  1: "bead"
  2: "cell-adhered"
  3: "soma"
