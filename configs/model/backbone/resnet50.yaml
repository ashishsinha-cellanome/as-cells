# configs/model/backbone/rtdetr_r101vd.yaml
# @package model.backbone

type: "resnet" 
name: "${model.rtdetr.model_name}"
model_name: resnet50

# Freezing params (standard semantics)
train_backbone: true     # If false, we freeze entire backbone
freeze_at_stage: 2        # 0=Nothing, 1=Stem+Stage0, 2=Stem+Stage0-1, 3=Stem+Stage0-2, 4=Entire backbone

# These are needed for logic consistency but won't change the architecture
# (The official R101 backbone outputs these channels naturally)
intermediate_channel_sizes: [128, 256, 512]
