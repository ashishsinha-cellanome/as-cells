defaults:
  - backbone: dinov2_mask2former

name: mask2former_${model.backbone.name}
input_size: 640

checkpointing:
  monitor: "val/segm_map"
  mode: "max"
  visualize_samples: 100

mask2former:
  pretrained_name_or_path: facebook/mask2former-swin-base-coco-instance
  local_files_only: false
  num_queries: 300
  threshold: 0.5
  mask_threshold: 0.5
  overlap_mask_area_threshold: 0.8

lora:
  enabled: false
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  target_modules: ["query", "value"]
  modules_to_save: []

ema:
  enabled: true
  decay: 0.993
  tau: 100
  warmup_steps: 2000

label_map:
  0: "cell"
  1: "bead"
  2: "cell-adhered"
  3: "soma"

detection_threshold: 0.5
draw_threshold: 0.5
max_detections: 100

# Override gradient clipping for Mask2Former stability (official FB impl uses 0.01)
trainer:
  max_grad_norm: 0.01
